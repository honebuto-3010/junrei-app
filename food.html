<div class="mag-header">
    <h2>巡礼の途中で出会った味 ─ 旅グルメ記</h2>
</div>

<section class="mag-article">
    <p class="mag-text">
        巡礼の旅では、その土地ならではの食べ物との出会いも楽しみのひとつ。
        ここでは、旅の途中で出会った印象深い料理を紹介します。
        その味は、旅の記憶とともに今も鮮明に残っています。
    </p>
</section>

<!-- ▼ 撮影フォーム（和風に整えた） -->
<section class="mag-article">
    <h3>旅グルメを記録する</h3>

    <p class="mag-text">スマホで撮影して、そのまま旅レポートに追加できます。</p>

    <input type="file" id="foodPhoto" accept="image/*" capture="camera">

    <img id="previewFood" style="width:100%; max-width:300px; margin-top:10px; display:block;">

    <label class="mag-text">料理名・店名</label>
    <input type="text" id="foodTitle" class="food-input">

    <label class="mag-text">感想・メモ</label>
    <textarea id="foodComment" class="food-textarea"></textarea>

    <button id="saveFood" class="food-button">保存する</button>
</section>

<!-- ▼ 自動追加される旅グルメ記事 -->
<div id="food-list"></div>

<section class="mag-article">
    <h3>旅と食の関係</h3>
    <p class="mag-text">
        旅先で食べた料理は、その土地の空気や人の温かさと結びついて記憶に残る。
        だからこそ、巡礼の旅には「食」も欠かせない要素だと感じている。
        これからも、心に残る味との出会いを楽しみに旅を続けたい。
    </p>
